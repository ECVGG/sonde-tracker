version: '3.8'

services:
  sonde-tracker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sonde-tracker
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"